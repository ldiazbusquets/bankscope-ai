name: Publish BankScope

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every Monday at 10:15 UTC. FDIC bank financials themselves update quarterly.
    - cron: '15 10 * * 1'

permissions:
  contents: read

concurrency:
  group: bankscope-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run financial unit tests
        run: python -m unittest discover -s tests -v
      - name: Update FDIC data using Python
        run: python scripts/build_data.py
      - name: Generate optional AI research reports
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python scripts/generate_ai.py
      - name: Version asset links so browsers never mix old and new files
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s#\./styles\.css\"#./styles.css?v=$v\"#; s#\./app\.js\"#./app.js?v=$v\"#; s#\./demo-data\.js\"#./demo-data.js?v=$v\"#" site/index.html
          grep -c "?v=$v" site/index.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
